<style>
:root{--navy:#102a43;--blue:#1976d2;--cyan:#2bb3c0;--bg:#f4f7fb;--card:#fff;--text:#172b4d;--muted:#6b7c93;--ok:#16865c;--bad:#c73a45;--line:#dce4ee;--shadow:0 10px 30px rgba(16,42,67,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;background:var(--bg)}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--navy),#174f78);color:white;padding:18px 20px 15px;box-shadow:0 3px 14px rgba(0,0,0,.18)}.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;font-size:18px}.sub{opacity:.78;font-size:12px;margin-top:2px}.iconbtn{border:1px solid rgba(255,255,255,.35);color:white;background:rgba(255,255,255,.1);padding:9px 12px;border-radius:12px;cursor:pointer}.progress{height:5px;background:rgba(255,255,255,.2);margin-top:13px;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#6de2e0;width:0;transition:.25s}.wrap{padding:20px}.hero{background:linear-gradient(145deg,#fff,#edf7fb);border:1px solid #d8e8f1;padding:22px;border-radius:22px;box-shadow:var(--shadow);margin-bottom:18px}.hero h1{font-size:27px;margin:0 0 9px}.hero p{color:var(--muted);line-height:1.55;margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.testcard,.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 18px rgba(16,42,67,.06)}.testcard{cursor:pointer;text-align:left}.testcard:hover{border-color:var(--blue);transform:translateY(-1px)}.testcard b{display:block;font-size:16px}.testcard span{display:block;color:var(--muted);font-size:13px;margin-top:6px}.badge{display:inline-flex!important;width:auto!important;padding:4px 8px;background:#e7f4ff;color:#1466a3;border-radius:99px;font-weight:700}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 12px}.sectiontitle h2{font-size:18px;margin:0}.btn{border:0;border-radius:14px;padding:13px 17px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e9f1f8;color:var(--navy)}.danger{background:#fff0f1;color:var(--bad)}.questionCard{background:white;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.qtext{font-size:20px;line-height:1.42;margin:17px 0}.option{display:flex;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;padding:14px;border-radius:15px;margin:10px 0;cursor:pointer;line-height:1.38}.option .letter{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:9px;background:#edf2f7;font-weight:850}.option.selected{border-color:var(--blue);background:#eef6ff}.option.correct{border-color:var(--ok);background:#eaf8f2}.option.wrong{border-color:var(--bad);background:#fff0f1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.nav .btn{flex:1}.result{text-align:center;background:white;border-radius:24px;padding:28px 20px;box-shadow:var(--shadow);border:1px solid var(--line)}.ring{width:128px;height:128px;border-radius:50%;margin:5px auto 18px;display:grid;place-items:center;background:conic-gradient(var(--ok) var(--pct),#e8edf3 0)}.ring:before{content:'';position:absolute;width:98px;height:98px;border-radius:50%;background:white}.ring strong{position:relative;font-size:25px}.status{font-size:30px;font-weight:900}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.rowstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.stat strong{display:block;font-size:25px}.explain{margin-top:12px;padding:14px;border-radius:14px;background:#f4f7fb;border-left:4px solid var(--blue);line-height:1.5;font-size:14px}.reviewItem{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px}.reviewItem h3{font-size:16px;line-height:1.4}.small{font-size:13px;color:var(--muted)}.empty{text-align:center;padding:45px 18px;color:var(--muted)}dialog{border:0;border-radius:20px;max-width:430px;width:calc(100% - 32px);box-shadow:0 25px 70px rgba(0,0,0,.25);padding:23px}dialog::backdrop{background:rgba(5,18,32,.52)}dialog h3{margin-top:0}.dialogActions{display:flex;gap:9px;margin-top:18px}.dialogActions button{flex:1}@media(max-width:520px){.wrap{padding:14px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:23px}.qtext{font-size:18px}.option{padding:12px}.nav{position:sticky;bottom:10px;background:rgba(244,247,251,.92);padding:8px;border-radius:18px;backdrop-filter:blur(8px)}}

<script>const TESTS=[{"id":1,"title":"Test de repaso 1","questions":[{"id":"1-1","test":1,"num":1,"q":"¿Qué es un sobrecalentador?","options":["Un haz de tubos calentado por los humos en el que el agua de alimentación se calienta antes de entrar en la caldera","Un haz de tubos calentado por los humos en el que se lleva al vapor a una temperatura mayor que la correspondiente a la saturación","Un haz de tubos calentado por los humos, en el que se priva al vapor húmedo que sale de la caldera de las partículas de agua que arrastra","Un haz de tubos calentado por los humos en el que se calienta el aire de combustión"],"correct":1,"explanation":"La respuesta correcta es la B: Un haz de tubos calentado por los humos en el que se lleva al vapor a una temperatura mayor que la correspondiente a la saturación. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-2","test":1,"num":2,"q":"Siendo la presión del vapor saturado a 133 °C de $3\\text{ kg/cm}^2$ absolutos, ¿en qué caso tendremos vapor?","options":["Vapor a $4\\text{ kg/cm}^2$ y 133 °C","Vapor a $2\\text{ kg/cm}^2$ y 133 °C","Vapor a $4\\text{ kg/cm}^2$ y 123 °C","Vapor a $3\\text{ kg/cm}^2$ y 123 °C"],"correct":1,"explanation":"La respuesta correcta es la B: Vapor a $2\\text{ kg/cm}^2$ y 133 °C. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-3","test":1,"num":3,"q":"¿Cuántas kilocalorías deberíamos suministrar a 10 kg de agua para aumentar su temperatura de 80 °C a 90 °C?","options":["10000 Kcal","1000 Kcal","1 Kcal","100 Kcal"],"correct":3,"explanation":"La respuesta correcta es la D: 100 Kcal. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-4","test":1,"num":4,"q":"¿Cuál de estas respuestas es cierta?","options":["$1\\text{ m}^3$ de vapor pesa igual que $1\\text{ m}^3$ de condensados","$1\\text{ m}^3$ de vapor a $12\\text{ kg/cm}^2$ pesa más que $1\\text{ m}^3$ de vapor a $4\\text{ kg/cm}^2$","$1\\text{ m}^3$ de agua caliente pesa más que $1\\text{ m}^3$ de agua fría","$1\\text{ m}^3$ de agua pesa igual que $1\\text{ m}^3$ de vapor"],"correct":1,"explanation":"La respuesta correcta es la B: $1\\text{ m}^3$ de vapor a $12\\text{ kg/cm}^2$ pesa más que $1\\text{ m}^3$ de vapor a $4\\text{ kg/cm}^2$. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-5","test":1,"num":5,"q":"Una caldera trabajando a $6\\text{ kg/cm}^2$ (164 °C) se enfría hasta 40 °C, manteniendo cerradas las salidas de vapor y entrada de agua. ¿Qué sucede con el nivel del agua?","options":["Sube","Primero baja y después sube","Baja","Se mantiene igual"],"correct":2,"explanation":"La respuesta correcta es la C: Baja. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-6","test":1,"num":6,"q":"¿A cuál de las siguientes temperaturas podemos sobrecalentar un vapor saturado que está a $6\\text{ kg/cm}^2$ de presión manométrica y 164 °C de temperatura?","options":["160 °C","150 °C","164 °C","180 °C"],"correct":3,"explanation":"La respuesta correcta es la D: 180 °C. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-7","test":1,"num":7,"q":"Cuando el condensado a presión procedente del purgador de un aparato se reduce bruscamente de presión ocurre lo siguiente:","options":["Se enfría el agua condensada sin producción de vapor","Se produce vapor que puede unirse al que sale de la caldera","Se produce vapor a menor presión que puede utilizarse para otros usos","Ninguna de las anteriores"],"correct":2,"explanation":"La respuesta correcta es la C: Se produce vapor a menor presión que puede utilizarse para otros usos. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-8","test":1,"num":8,"q":"¿Por qué debe disminuirse el contenido de óxido de carbono en los gases de la combustión?","options":["Porque reduce el hollín formado","Porque su combustión con aire origina más calor y aumenta el rendimiento del proceso","No debe disminuirse","Ninguna de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Porque su combustión con aire origina más calor y aumenta el rendimiento del proceso. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-9","test":1,"num":9,"q":"Un recipiente cerrado herméticamente contiene vapor saturado seco a $14\\text{ kg/cm}^2$ y 198 °C. Se deja enfriar hasta unos 130 °C y se observa que la presión ha descendido a $2\\text{ kg/cm}^2$. ¿Qué contendrá ahora el recipiente?","options":["Vapor saturado","Vapor saturado + agua","Vapor recalentado","Ninguna de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Vapor saturado + agua. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-10","test":1,"num":10,"q":"Un quemador que funciona con menos aire del necesario, ¿se nota porque...?","options":["La proporción del oxígeno en los humos es demasiado alta","Los gases abandonarán la caldera a temperatura superior a la normal","Hay un exceso de $\\text{CO}_2$","Hay un exceso de $\\text{CO}$"],"correct":3,"explanation":"La respuesta correcta es la D: Hay un exceso de $\\text{CO}$. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-11","test":1,"num":11,"q":"El exceso de aire es:","options":["El aumento del aire para facilitar el tiro","El aumento de aire para que no se apague el hogar","El aumento de la dosis de aire para que no queden inquemados","Todas las anteriores"],"correct":2,"explanation":"La respuesta correcta es la C: El aumento de la dosis de aire para que no queden inquemados. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-12","test":1,"num":12,"q":"¿Qué nos indica primordialmente el índice de opacidad o de Bacharach?","options":["La cantidad de $\\text{CO}$ producido","El exceso de aire que tenemos","La cantidad de inquemados, en combustibles sólidos y líquidos","La cantidad de $\\text{CO}_2$ producido"],"correct":2,"explanation":"La respuesta correcta es la C: La cantidad de inquemados, en combustibles sólidos y líquidos. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-13","test":1,"num":13,"q":"En un calentamiento por vapor saturado, ¿qué tipo de calor es utilizado?","options":["El calor latente de cambio de estado","El calor sensible de los condensados","El calor sensible del vapor","Todas las anteriores"],"correct":0,"explanation":"La respuesta correcta es la A: El calor latente de cambio de estado. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-14","test":1,"num":14,"q":"¿Qué experimenta el volumen específico ($\\text{m}^3/\\text{kg}$) del vapor al aumentar la presión?","options":["Primero disminuye luego se estabiliza","Disminuye","Primero aumenta luego se estabiliza","Aumenta"],"correct":1,"explanation":"La respuesta correcta es la B: Disminuye. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-15","test":1,"num":15,"q":"¿Qué tipo de hogar deberá tener una caldera con quemador y ventilador incorporado, así como un extractor de humos a la salida?","options":["Presurizado","Equilibrado","En depresión","Ninguna de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Equilibrado. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-16","test":1,"num":16,"q":"¿Es posible que en los humos de la combustión tengamos azufre?","options":["No, pues ningún combustible lleva azufre","Sí, porque el aire lleva impurezas que dan azufre","Sí, porque el combustible puede llevar algo de azufre","Ninguna de las anteriores"],"correct":2,"explanation":"La respuesta correcta es la C: Sí, porque el combustible puede llevar algo de azufre. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-17","test":1,"num":17,"q":"Para pasar de vapor a agua se puede:","options":["Disminuir la presión","Aumentar la temperatura","Dejar igual presión y temperatura","Bajar temperatura o subir presión"],"correct":3,"explanation":"La respuesta correcta es la D: Bajar temperatura o subir presión. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-18","test":1,"num":18,"q":"El calor específico es:","options":["Masa o volumen","Calor necesario para fundir el hielo","Cantidad de calor que hay que transferir a la unidad de masa para elevar su temperatura en 1 °C","Ninguna de las anteriores"],"correct":2,"explanation":"La respuesta correcta es la C: Cantidad de calor que hay que transferir a la unidad de masa para elevar su temperatura en 1 °C. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-19","test":1,"num":19,"q":"El calor de vaporización es el que se utiliza para:","options":["Producir una elevación de la temperatura del líquido","Producir un cambio de estado sin elevar la temperatura","Producir un cambio de estado elevando la temperatura","Es constante para todos fluidos"],"correct":1,"explanation":"La respuesta correcta es la B: Producir un cambio de estado sin elevar la temperatura. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-20","test":1,"num":20,"q":"La fuerza que actúa sobre la unidad de superficie se llama:","options":["Calorías","Trabajo","Potencia","Presión"],"correct":3,"explanation":"La respuesta correcta es la D: Presión. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-21","test":1,"num":21,"q":"Los manómetros son aparatos para medir:","options":["Presión relativa","Presión absoluta","Fuerza","Potencia"],"correct":0,"explanation":"La respuesta correcta es la A: Presión relativa. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-22","test":1,"num":22,"q":"La presión absoluta es:","options":["La máxima presión permitida en una caldera","La suma de la presión manométrica más la atmosférica","Una forma de clasificar la categoría de las calderas","La presión que puede explotar una caldera"],"correct":1,"explanation":"La respuesta correcta es la B: La suma de la presión manométrica más la atmosférica. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-23","test":1,"num":23,"q":"¿A cuántos grados Celsius corresponden 285 K?","options":["85 °C","212 °C","12 °C","80 °C"],"correct":2,"explanation":"La respuesta correcta es la C: 12 °C. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-24","test":1,"num":24,"q":"¿Existe relación entre la presión y la temperatura de vaporización de un líquido?","options":["Sí, al aumentar la presión, disminuirá la temperatura de vaporización de un líquido","No existe ninguna relación","Sí, al disminuir la presión, aumentará la temperatura de vapor de un líquido","Sí, al aumentar la presión aumentará la temperatura de vaporización de un líquido"],"correct":3,"explanation":"La respuesta correcta es la D: Sí, al aumentar la presión aumentará la temperatura de vaporización de un líquido. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-25","test":1,"num":25,"q":"El agua al calentarse, comenzará a hervir (convertirse en vapor) a la temperatura de:","options":["Depende de la presión a que se encuentre la caldera","Por encima de 110 °C","Depende de la cantidad de calor que aportemos a la misma","273 K"],"correct":0,"explanation":"La respuesta correcta es la A: Depende de la presión a que se encuentre la caldera. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-26","test":1,"num":26,"q":"Una caldera no incluida en las categorías de I a IV, según el RD 709/2015 (769/1999) realizará inspecciones periódicas:","options":["Cada 6 años","Después de una reparación importante","No están sujetas a inspecciones periódicas","Anualmente"],"correct":2,"explanation":"La respuesta correcta es la C: No están sujetas a inspecciones periódicas. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-27","test":1,"num":27,"q":"¿Es posible que en los humos de la combustión tengamos $\\text{SO}_2$?","options":["Sí, porque el aire lleva impurezas que dan $\\text{SO}_2$","No, pues ningún combustible lleva azufre","Sí, porque el combustible puede contener azufre","No depende del combustible"],"correct":2,"explanation":"La respuesta correcta es la C: Sí, porque el combustible puede contener azufre. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-28","test":1,"num":28,"q":"¿Qué tipo de combustibles necesitan mayor exceso de aire?","options":["Gaseoso","Sólidos / Biomasa","Líquidos","No depende del combustible, depende de la presión caldera"],"correct":1,"explanation":"La respuesta correcta es la B: Sólidos / Biomasa. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-29","test":1,"num":29,"q":"¿A qué se denomina agua blanda?","options":["Las de alto contenido de $\\text{Ca}$ y $\\text{Mg}$","Las que contienen pocos iones de $\\text{Ca}$ y $\\text{Mg}$","Las que tienen un pH ácido","Las que tienen un pH alcalino"],"correct":1,"explanation":"La respuesta correcta es la B: Las que contienen pocos iones de $\\text{Ca}$ y $\\text{Mg}$. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"1-30","test":1,"num":30,"q":"¿A qué presión deberá realizarse la primera prueba hidráulica de una caldera?","options":["A 1,25 por los factores de TS, materiales, etc. considerados por el fabricante en condiciones extremas de servicio","A 1,43 por la PS (presión máxima admisible)","Al más elevado de los dos valores anteriores","Ningún valor anterior es correcto"],"correct":2,"explanation":"La respuesta correcta es la C: Al más elevado de los dos valores anteriores. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."}]},{"id":2,"title":"Test de repaso 2","questions":[{"id":"2-1","test":2,"num":1,"q":"¿Qué hay dentro de un domo?","options":["Agua","Vapor","Agua y vapor","Ninguna de las anteriores"],"correct":2,"explanation":"La respuesta correcta es la C: Agua y vapor. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"2-2","test":2,"num":2,"q":"En una caldera acuotubular el haz tubular donde el agua se vaporiza se denomina:","options":["Economizador","Desgasificador","Haz vaporizador","Separador de vapor"],"correct":2,"explanation":"La respuesta correcta es la C: Haz vaporizador. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"2-3","test":2,"num":3,"q":"¿Para qué sirve una válvula de retención?","options":["Para limitar el caudal","Para regular el caudal","Para cerrar el paso de un líquido","Para dejar pasar el fluido en un solo sentido"],"correct":3,"explanation":"La respuesta correcta es la D: Para dejar pasar el fluido en un solo sentido. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"2-4","test":2,"num":4,"q":"¿Qué hacen los limitadores de nivel termostáticos?","options":["Bloquean el quemador por exceso de presión","Bloquean el quemador por bajo nivel de agua","Bloquean el quemador por falta de temperatura del fuel","Ninguna de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Bloquean el quemador por bajo nivel de agua. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"2-5","test":2,"num":5,"q":"La parte donde el humo de la combustión cambia de sentido antes de pasar por el haz tubular recibe el nombre de:","options":["Caja de humo","Caja de hogar","Caja de registro","Caja de expansión"],"correct":1,"explanation":"La respuesta correcta es la B: Caja de hogar. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"2-6","test":2,"num":6,"q":"¿Cuántas cajas de humos tiene una caldera pirotubular de un hogar con la chimenea situada en la parte delantera?","options":["Dos","Una o tres","Una o dos","Dos o tres"] itan nada; basta el operador"],"correct":1,"explanation":"La respuesta correcta es la B: Un dispositivo de corte de aportación calorífica y una alarma acústica para las condiciones de temperatura excesiva y de nivel de líquido insuficiente en el vaso de expansión. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-5","test":5,"num":5,"q":"Las calderas de vapor saturado con nivel definido podrán disponer de una sola válvula de seguridad:","options":["Sólo si son de categoría 2","Sólo si son de clase primera","Falso","Cierto, si así lo decide el fabricante"],"correct":3,"explanation":"La respuesta correcta es la D: Cierto, si así lo decide el fabricante. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-6","test":5,"num":6,"q":"Cuando se instale un sistema de purga continua, éste llevará, según la legislación vigente:","options":["Dos válvulas de retención","Una sola válvula micrométrica con indicador de apertura","Dos válvulas, una de cierre y la segunda de tipo aguja micrométrica con indicador de apertura","Ninguna de las anteriores"],"correct":2,"explanation":"La respuesta correcta es la C: Dos válvulas, una de cierre y la segunda de tipo aguja micrométrica con indicador de apertura. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-7","test":5,"num":7,"q":"En una instalación con 2 calderas y distribuidor común de vapor, ¿qué debe existir en las tuberías de salida de vapor de cada caldera?","options":["Válvula de retención","Válvula de seguridad","Válvula de interrupción","Válvula de retención e interrupción"],"correct":3,"explanation":"La respuesta correcta es la D: Válvula de retención e interrupción. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-8","test":5,"num":8,"q":"Los operadores de calderas pirotubulares con un $Pms \\times VT$ menor de 15000:","options":["Basta con el libro de instrucciones","Deberán poseer obligatoriamente el carné de Operadores de Caldera","Al tratarse de una caldera de clase primera podrán ser instruidos por el fabricante, el instalador o por el usuario, si dispone de técnico titulado competente. No necesitan carné","No necesitan nada"],"correct":2,"explanation":"La respuesta correcta es la C: Al tratarse de una caldera de clase primera podrán ser instruidos por el fabricante, el instalador o por el usuario, si dispone de técnico titulado competente. No necesitan carné. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-9","test":5,"num":9,"q":"¿Cuál de estas respuestas es correcta?","options":["En una caldera es preferible un sistema de purga intermitente a uno de purga continua","En una caldera es preferible que el sistema de purga intermitente se realice cuando la demanda de vapor sea lo más baja","La purga intermitente es mejor realizarla cuando la demanda de vapor sea la más alta","Ninguna de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: En una caldera es preferible que el sistema de purga intermitente se realice cuando la demanda de vapor sea lo más baja. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-10","test":5,"num":10,"q":"Si una caldera de combustible sólido tiene un reventón de tubos y se queda sin nivel, ¿qué debe hacer?","options":["Alimentar continuamente","Abrir las válvulas de seguridad","Continuar en servicio hasta comprobar si sube de nuevo el nivel","Parar la alimentación de combustible, apagar el fuego, y sobre todo parar ventiladores"],"correct":3,"explanation":"La respuesta correcta es la D: Parar la alimentación de combu sarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-23","test":5,"num":23,"q":"¿Cuándo se hará la primera Inspección Nivel C?","options":["Al año","A los tres años de la entrada en servicio de la caldera","A los seis años de la entrada en servicio de la caldera, salvo que sufra antes una reparación o modificación","A los diez años de la entrada en servicio de la caldera"],"correct":2,"explanation":"La respuesta correcta es la C: A los seis años de la entrada en servicio de la caldera, salvo que sufra antes una reparación o modificación. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-24","test":5,"num":24,"q":"Las calderas de clase segunda para su instalación requerirán:","options":["Proyecto técnico","Carpeta de planos y memoria del instalador","Croquis detallado de la instalación","Por ser de clase 2ª, no requiere proyecto"],"correct":0,"explanation":"La respuesta correcta es la A: Proyecto técnico. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-25","test":5,"num":25,"q":"Un índice de Bacharach adecuado para combustibles líquidos pesados será:","options":["Entre 5 y 6","Entre 0 y 1","Entre 2 y 3","Ninguno de los anteriores"],"correct":2,"explanation":"La respuesta correcta es la C: Entre 2 y 3. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-26","test":5,"num":26,"q":"Caldera automática es:","options":["La que realiza su ciclo de trabajo automáticamente","Se efectúa el arranque manualmente","Se rearma manualmente tras bloquearse por actuación de una seguridad","Todas las anteriores"],"correct":3,"explanation":"La respuesta correcta es la D: Todas las anteriores. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-27","test":5,"num":27,"q":"En una caldera acuotubular, la superficie que determina (LWL) el nivel mínimo de agua estará situada por encima de la superficie de intercambio de calor más elevada (HHS):","options":["100 mm","70 mm","150 mm","Ninguna de las anteriores"],"correct":2,"explanation":"La respuesta correcta es la C: 150 mm. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-28","test":5,"num":28,"q":"En una caldera de vapor en funcionamiento, ¿cómo debe cerrarse la válvula de salida de vapor al servicio?","options":["Lentamente","Lenta y progresivamente","No debe cerrarse mientras funcione","Si la caldera es automática ya se cierra sola"],"correct":2,"explanation":"La respuesta correcta es la C: No debe cerrarse mientras funcione. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-29","test":5,"num":29,"q":"Una fuerza de 32 kg que actúa sobre una superficie de $8\\text{ cm}^2$, ejercerá una presión equivalente a:","options":["$16\\text{ kg/cm}^2$","$8\\text{ kg/cm}^2$","$2\\text{ kg/cm}^2$","$4\\text{ kg/cm}^2$"],"correct":3,"explanation":"La respuesta correcta es la D: $4\\text{ kg/cm}^2$. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"5-30","test":5,"num":30,"q":"La sensibilidad de los manómetros instalados en calderas serán de:","options":["Sensibilidad clase 1","Sensibilidad clase 4","Sensibilidad clase 7","Ninguna de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Sensibilidad clase 4. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."}]},{"id":6,"title":"Test de repaso 6","questions":[{"id":"6-1","test":6,"num":1,"q":"Cuando exista un colector de vapor común para d ención. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-9","test":6,"num":9,"q":"En el caso de dos o más calderas de agua sobrecalentada conectadas en paralelo, ¿cuántas válvulas de interrupción serán precisas para comunicar el circuito principal de las calderas?","options":["Sólo en una caldera","Una válvula en cada caldera","No es necesaria válvula de interrupción","Ninguna de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Una válvula en cada caldera. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-10","test":6,"num":10,"q":"Marcar la causa de bloqueo del quemador en una caldera automática de vigilancia directa de agua sobrecalentada:","options":["Alta presión","Alta temperatura","Bajo nivel en caldera","Bajo nivel en depósito expansión"],"correct":3,"explanation":"La respuesta correcta es la D: Bajo nivel en depósito expansión. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-11","test":6,"num":11,"q":"La persona que es titular de un carné de operadores de calderas según la reglamentación vigente está autorizada para:","options":["Instalar y mantener calderas","Reparar y mantener calderas","Es el responsable legal ante la administración de que la instalación a su cargo cumpla con la normativa vigente","Vigilar, supervisar, conducir calderas"],"correct":3,"explanation":"La respuesta correcta es la D: Vigilar, supervisar, conducir calderas. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-12","test":6,"num":12,"q":"Accionar el dispositivo manual de apertura de una válvula de seguridad es una operación:","options":["Es una operación que solo debe hacerse en las inspecciones oficiales","Que es imposible hacer, pues este mecanismo no existe","Que es recomendable hacer periódicamente (cuando indique el fabricante)","Que solo puede hacer el Organismo de Control Autorizado (O.C.A.), ya que el precinto se rompe"],"correct":2,"explanation":"La respuesta correcta es la C: Que es recomendable hacer periódicamente (cuando indique el fabricante). La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-13","test":6,"num":13,"q":"¿Se puede realizar algún tipo de trabajo dentro de una sala de calderas?","options":["Depende de la categoría de la sala","Sólo se permiten trabajos relacionados con los aparatos contenidos en la misma","Sí, siempre que se paren las calderas","Sí, siempre y cuando no supongan el encendido de llamas o provoquen chispas"],"correct":1,"explanation":"La respuesta correcta es la B: Sólo se permiten trabajos relacionados con los aparatos contenidos en la misma. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-14","test":6,"num":14,"q":"Si el quemador de una caldera automática arranca, pero se para debido a que el dispositivo de seguridad se desconecta, la causa más probable es:","options":["Presostato de trabajo no ejerce de contacto","Control de combustión (célula) no esté en posición en marcha","Ignición defectuosa (electrodos sucios, chiclé obstruido...)","No hay tensión eléctrica"],"correct":2,"explanation":"La respuesta correcta es la C: Ignición defectuosa (electrodos sucios, chiclé obstruido...). La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-15","test":6,"num":15,"q":"¿Cómo se debe apagar una caldera para dejarla fuera de servicio?","options":["Se debe bajar la presión rápidamente extrayendo el vapor lo más rápido posible","Se debe dejar cerrada la válvula de venteo para no crear vacío","Debe controlarse que la temperatura baje lo más rápidamente posible","Se debe dejar bajar la presión y temperatura lentamente"],"correct":3,"explanation":"La respuesta correcta es la D: Se debe dejar bajar la presión y temperatura lentamente. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-16","test":6,"num":16,"q":"Antes de la puesta en servicio de una caldera que ha sufrido un cambio de combustible (por ejemplo: de fuel a gas natural) y que en la documentación original del fabricante del equipo se acredita que la caldera es apta para el nuevo combustible, deberá realizarse una inspección de nivel:","options":["A","B","C","D"],"correct":1,"explanation":"La respuesta correcta es la B: B. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-17","test":6,"num":17,"q":"¿Quiénes pueden realizar las inspecciones de Nivel B en una caldera?","options":["Una empresa instaladora EIP-2","El fabricante del equipo","Una OCA","Todas las respuestas son correctas"],"correct":3,"explanation":"La respuesta correcta es la D: Todas las respuestas son correctas. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-18","test":6,"num":18,"q":"Se consideran de clase segunda, las calderas acuotubulares cuyo $Pms \\times VT$ sea igual o mayor que:","options":["15.000","25.000","50.000","40.000"],"correct":2,"explanation":"La respuesta correcta es la C: 50.000. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-19","test":6,"num":19,"q":"¿Qué se entiende como cavitación de la bomba de impulsión en una caldera pirotubular?","options":["La condensación del agua al entrar en la bomba","El aumento de presión del agua a la salida de la bomba","La vaporización del agua en el interior de la bomba, que impedirá su correcto funcionamiento","Falta de corriente eléctrica en el motor de la bomba"],"correct":2,"explanation":"La respuesta correcta es la C: La vaporización del agua en el interior de la bomba, que impedirá su correcto funcionamiento. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-20","test":6,"num":20,"q":"En una caldera sin marcado CE cuya PS (presión máxima admisible) es de 10 bares, ¿cuál debería ser la presión de la Prueba Hidrostática (Pt), en la inspección de Nivel C?","options":["10 bares","13 bares","15 bares","Ninguna es correcta de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: 13 bares. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-21","test":6,"num":21,"q":"La instalación de una caldera de clase primera, deberá realizarla:","options":["Una empresa Instaladora EIP-2 y requiere presentar proyecto","Una empresa instaladora EIP-1","Una empresa instaladora EIP-2 y no requerirá la presentación de proyecto","El propio usuario si dispone de Técnico competente"],"correct":2,"explanation":"La respuesta correcta es la C: Una empresa instaladora EIP-2 y no requerirá la presentación de proyecto. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-22","test":6,"num":22,"q":"El Reglamento de Equipos a Presión (REP) es de aplicación para los equipos a presión sometidos a una Presión Máxima Admisible superior a:","options":["0,3 bar","0,5 bar","1,0 bar","2,0 bar"],"correct":1,"explanation":"La respuesta correcta es la B: 0,5 bar. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-23","test":6,"num":23,"q":"¿A qué presión, como ."},{"id":"6-27","test":6,"num":27,"q":"Una caldera de aceite térmico cuya instalación tenga un volumen total superior a 1000 litros, ¿qué coeficiente de seguridad aplicaremos a la expansión máxima en su vaso de expansión?","options":["1,5 la capacidad de expansión máxima","2,0 la capacidad de expansión máxima","1,3 la capacidad de expansión máxima","Todas las anteriores"],"correct":2,"explanation":"La respuesta correcta es la C: 1,3 la capacidad de expansión máxima. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-28","test":6,"num":28,"q":"Un desmineralizador sirve para:","options":["Eliminar el oxígeno del agua","Eliminar todos los iones del agua","Eliminar materias no disueltas","Todas las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Eliminar todos los iones del agua. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-29","test":6,"num":29,"q":"La secuencia de encendido de una caldera automática es la siguiente:","options":["Presurizado, exceso de aire y combustión","Barrido, aportación calor, apertura válvulas combustible, control llama principal y su ajuste","Ignición, combustión, salida gases","Ninguna de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Barrido, aportación calor, apertura válvulas combustible, control llama principal y su ajuste. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"6-30","test":6,"num":30,"q":"Los quemadores se clasifican en:","options":["Manuales, semi-automáticos y automáticos","Rotativos, neumáticos y de presión o pulverización mecánica","Vigilancia directa, Vigilancia indirecta y mixtos","De alta, media y baja presión"],"correct":1,"explanation":"La respuesta correcta es la B: Rotativos, neumáticos y de presión o pulverización mecánica. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."}]},{"id":7,"title":"Test de repaso 7","questions":[{"id":"7-1","test":7,"num":1,"q":"¿Qué calderas pueden estar en cualquier sala de trabajo?","options":["Calderas de clase primera, aunque cumpliendo ciertos requisitos (valla metálica 1,20 m, espacio suficiente, etc.)","Calderas de categoría 2","Calderas de funcionamiento automático","Calderas de vigilancia indirecta"],"correct":0,"explanation":"La respuesta correcta es la A: Calderas de clase primera, aunque cumpliendo ciertos requisitos (valla metálica 1,20 m, espacio suficiente, etc.). La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-2","test":7,"num":2,"q":"En las calderas la interrupción de combustible gaseoso deberá realizarse:","options":["Mediante dos válvulas automáticas instaladas en serie, con una descarga intermedia al aire libre","Dos sistemas de corte independiente","Una válvula automática y una de cierre manual","Ninguna de las anteriores"],"correct":0,"explanation":"La respuesta correcta es la A: Mediante dos válvulas automáticas instaladas en serie, con una descarga intermedia al aire libre. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-3","test":7,"num":3,"q":"Cuando se para la bomba de alimentación de agua en una caldera de vapor con nivel definido, ¿qué automatismo ha actuado?","options":["El presostato de seguridad","La válvula de seguridad","El controlador de nivel","La fotocélula"],"correct":2,"explanation":"La respuesta correcta es la C: El controlador de nivel. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-4","test":7,"num":4,"q":"El cambio de la cámara de combustión de una caldera requerirá:","options":["Certificado de instalación y puesta en marcha","Certificado de reparación y acta de pruebas","Certificado de dirección y finalización de obras","Todas las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Certificado de reparación y acta de pruebas. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-5","test":7,"num":5,"q":"Una caldera reparada deberá superar una Inspección de Nivel C realizada por:","options":["El instalador","Por el fabricante","Por el Organismo Colaborador de la Administración si es de clase segunda","Por el Organismo de Control Habilitado por los Servicios Competentes de la Administración Autonómica que corresponda, en todos los casos (clase 1ª y clase 2ª)"],"correct":3,"explanation":"La respuesta correcta es la D: Por el Organismo de Control Habilitado por los Servicios Competentes de la Administración Autonómica que corresponda, en todos los casos (clase 1ª y clase 2ª). La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-6","test":7,"num":6,"q":"Las calderas instaladas para su identificación irán provistas de:","options":["Placa de diseño","Placa de instalación e inspecciones periódicas","Placa del fabricante","Ninguna de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Placa de instalación e inspecciones periódicas. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-7","test":7,"num":7,"q":"¿Qué relación existe entre la presión manométrica y la presión absoluta?","options":["La manométrica es $1\\text{ kg/cm}^2$ más grande que la absoluta","Son prácticamente iguales","La absoluta es la presión manométrica más la presión atmosférica","La manométrica es un 30% mayor que la absoluta"],"correct":2,"explanation":"La respuesta correcta es la C: La absoluta es la presión manométrica más la presión atmosférica. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-8","test":7,"num":8,"q":"Las válvulas de seguridad de una caldera tienen la función de:","options":["Evitar que el vapor sobrepase la temperatura de servicio prevista","Evitar que el nivel del agua se sitúe por debajo del nivel mínimo","Evitar que supere una presión prefijada (Pp)","Evitar el encendido automático del quemador"],"correct":2,"explanation":"La respuesta correcta es la C: Evitar que supere una presión prefijada (Pp). La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-9","test":7,"num":9,"q":"Además del depósito nodriza del combustible para las calderas, se admitirá el almacenamiento de productos combustibles en la sala de calderas en:","options":["Calderas de clase primera","Calderas de clase segunda","Calderas de categoría 3","Ninguna de las anteriores"],"correct":3,"explanation":"La respuesta correcta es la D: Ninguna de las anteriores. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-10","test":7,"num":10,"q":"En las salas de calderas podrán realizarse trabajos que:","options":["Sólo estén relacionados con los aparatos de la sala","No precisen de sustancias inflamables para su ejecución","De todo tipo si son realizados por personal cualificado de la empresa","Ningún tipo de trabajo"],"correct":0,"explanation":"La respuesta correcta es la A: Sólo estén relacionados con los aparatos de la sala. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-11","test":7,"num":11,"q":"¿En qué calderas está permitida la alimentación por bomba a mano?","options":["En ninguna","En las ntes de la Administración, en cualquier caso","Por la empresa instaladora","Por el Fabricante","Por la empresa instaladora y supervisadas por alguna OCA si la instalación requiere proyecto"],"correct":3,"explanation":"La respuesta correcta es la D: Por la empresa instaladora y supervisadas por alguna OCA si la instalación requiere proyecto. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-19","test":7,"num":19,"q":"Las Inspecciones Nivel A de una caldera podrán realizarse por:","options":["El fabricante","El instalador","El usuario (auto mantenimiento)","Todos los anteriores si cumplen los requisitos especificados en el Anexo I del R.E.P."],"correct":3,"explanation":"La respuesta correcta es la D: Todos los anteriores si cumplen los requisitos especificados en el Anexo I del R.E.P.. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-20","test":7,"num":20,"q":"¿Cuál de las respuestas es correcta?","options":["Las válvulas de purga, no serán inferiores a DN20, ni superiores a DN 50","En las tuberías de drenaje (vaciado) de la caldera se instalará una válvula de cierre","En las tuberías de purga de fondo se instalará una válvula de interrupción y una de apertura rápida","Todas las anteriores"],"correct":3,"explanation":"La respuesta correcta es la D: Todas las anteriores. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-21","test":7,"num":21,"q":"¿Qué válvulas pueden montarse en cualquier sentido, según el paso del fluido?","options":["De compuerta","De seguridad","De retención","De asiento"],"correct":0,"explanation":"La respuesta correcta es la A: De compuerta. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"7-22","test" rso de Operador Industrial de Calderas."},{"id":"8-29","test":8,"num":29,"q":"El manual de seguridad del Operador de Calderas deberá redactarlo:","options":["El fabricante de la caldera","Únicamente un instalador autorizado","El usuario de la caldera","Una empresa mantenedora de equipos a presión"],"correct":2,"explanation":"La respuesta correcta es la C: El usuario de la caldera. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"8-30","test":8,"num":30,"q":"Si el fabricante de la caldera no ha indicado instrucciones para la vigilancia de la caldera, ésta se considerará:","options":["De vigilancia directa","De vigilancia indirecta","Lo decidirá el instalador de la caldera","Lo decidirá el usuario de la caldera"],"correct":0,"explanation":"La respuesta correcta es la A: De vigilancia directa. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."}]},{"id":9,"title":"Test de repaso 9","questions":[{"id":"9-1","test":9,"num":1,"q":"¿La operación de barrido de un quemador es?","options":["La aireación manual del hogar","El tiempo que requiere el quemador para ponerse en marcha","Maniobra automática de eliminación de los gases del circuito de humos","El aire de combustión que inyecta el quemador"],"correct":2,"explanation":"La respuesta correcta es la C: Maniobra automática de eliminación de los gases del circuito de humos. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-2","test":9,"num":2,"q":"¿Qué consecuencia tiene que la cantidad de aire de la combustión sea inferior al necesario cuando se quema fuel-oil?","options":["Temperatura de los gases en la chimenea excesivamente alta","Mayor porcentaje $\\text{CO}_2$ en los gases de la chimenea","Formación de hollín","Todas las respuestas son correctas"],"correct":2,"explanation":"La respuesta correcta es la C: Formación de hollín. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-3","test":9,"num":3,"q":"Una caldera con vigilancia indirecta debe cumplir la siguiente condición:","options":["Desde dicho lugar, no podrá bloquearse el sistema de calefacción","Desde dicho lugar, podrá volverse a poner en servicio la caldera","La señal acústica accionada por los dispositivos de seguridad debe repetirse en la sala donde se halle el conductor de la caldera","No es necesaria la actuación del operador"],"correct":0,"explanation":"La respuesta correcta es la A: Desde dicho lugar, no podrá bloquearse el sistema de calefacción. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-4","test":9,"num":4,"q":"Las inspecciones periódicas de Nivel C de una caldera de clase segunda deberán realizarse por:","options":["El fabricante de la caldera","El usuario de la caldera","El instalador autorizado","Un Organismo de Control autorizado por la Generalitat"],"correct":3,"explanation":"La respuesta correcta es la D: Un Organismo de Control autorizado por la Generalitat. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-5","test":9,"num":5,"q":"¿Qué relación existe entre la presión manométrica y la presión absoluta?","options":["La manométrica es 1 bar más que la absoluta","Son prácticamente iguales","La absoluta es la presión manométrica más la atmosférica","No hay ninguna relación"],"correct":2,"explanation":"La respuesta correcta es la C: La absoluta es la presión manométrica más la atmosférica. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-6","test":9,"num":6,"q":"¿En qué calderas está permitida la alimentación por bomba a mano?","options":["En ninguna","En las de clase Primera","En las de vigilancia directa","En las que se cumple $Pms \\times Vt < 5.000\\ (\\text{bar} \\times \\text{litros})$"],"correct":0,"explanation":"La respuesta correcta es la A: En ninguna. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-7","test":9,"num":7,"q":"La regulación progresiva modulante es la variación de la aportación calórica de una caldera:","options":["Que permite establecer posiciones intermedias entre los valores máximo y mínimo","Que puede permanecer estable en cualquier valor entre los caudales máximo y mínimo","Correspondiente a los caudales máximo, mínimo o nulo","Correspondiente a los caudales único constante o nulo"],"correct":1,"explanation":"La respuesta correcta es la B: Que puede permanecer estable en cualquier valor entre los caudales máximo y mínimo. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-8","test":9,"num":8,"q":"Una caldera en la que el tiro es producido por un ventilador junto al quemador, ¿cómo tiene el hogar?","options":["En depresión","En sobrepresión","A veces en depresión y a veces en sobrepresión, dependiendo de la cantidad de combustible que queme","Siempre a presión atmosférica"],"correct":1,"explanation":"La respuesta correcta es la B: En sobrepresión. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-9","test":9,"num":9,"q":"Toda caldera de agua caliente:","options":["Deberá estar unida a un vaso de expansión","Deberá tener una válvula de seguridad si es de circuito cerrado","Sus válvulas de cierre tendrán un dispositivo que impida la separación de la caldera del vaso de expansión","Todas las respuestas son correctas"],"correct":3,"explanation":"La respuesta correcta es la D: Todas las respuestas son correctas. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-10","test":9,"num":10,"q":"¿Qué diferencia existe entre una caldera de agua caliente y una de agua sobrecalentada?","options":["Que la de agua caliente no produce vapor y la de agua sobrecalentada sí","Que la de agua sobrecalentada ha de tener precalentador","Que la de agua caliente no sobrepasa los 110 °C y la de agua sobrecalentada sí","Que la de agua caliente es de menor tamaño a la de agua sobrecalentada"],"correct":2,"explanation":"La respuesta correcta es la C: Que la de agua caliente no sobrepasa los 110 °C y la de agua sobrecalentada sí. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-11","test":9,"num":11,"q":"¿Qué es un economizador?","options":["Un haz de tubos calentado por los humos, en el que se priva al vapor húmedo que sale de la caldera de las partículas de agua que arrastra","Un haz de tubos calentado por los humos en el que se lleva el vapor a una temperatura mayor a la que le corresponde por su presión","Un haz de tubos calentado por los humos en el que el agua de alimentación se calienta antes de entrar en la caldera","Es un elemento que transforma el vapor saturado en vapor sobrecalentado"],"correct":2,"explanation":"La respuesta correcta es la C: Un haz de tubos calentado por los humos en el que el agua de alimentación se calienta antes de entrar en la caldera. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-12","test":9,"num":12,"q":"¿Qué tipo de calderas deben llevar un dispositivo que bloquee el quemador cuando el caudal del fluido transmisor (agua, aceite, vapor, etc.) sea inferior a un mínimo?","options":["Calderas de combustibles gaseosos","Calderas de Fluido Térmico","Calderas de nivel de agua definido","Calderas con nivel de agua no definido"],"correct":1,"explanation":"La respuesta correcta es la B: Calderas de Fluido Térmico. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-13","test":9,"num":13,"q":"Si en una caldera en marcha no se observa nivel de agua:","options":["Se incorpora agua tratada para restablecer el nivel","Se abre la válvula de seguridad para evacuar vapor","Se hacen las dos operaciones A y B a la vez","Se detiene manualmente la caldera y se deja que se enfríe"],"correct":3,"explanation":"La respuesta correcta es la D: Se detiene manualmente la caldera y se deja que se enfríe. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-14","test":9,"num":14,"q":"El cambio de combustible y el equipo correspondiente de una caldera podrá ser realizado por:","options":["El servicio de mantenimiento del titular de la caldera","Una Entidad de Inspección y Control concesionaria de la Administración","Una empresa oficialmente inscrita como reparadora de equipos a presión","Una empresa instaladora de equipos a presión oficialmente inscrita"],"correct":2,"explanation":"La respuesta correcta es la C: Una empresa oficialmente inscrita como reparadora de equipos a presión. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-15","test":9,"num":15,"q":"¿Cuándo no debe dejarse nunca la caldera llena de agua durante un paro prolongado?","options":["Cuando exista riesgo eléctrico","Cuando exista riesgo de congelación","Cuando exista riesgo de calentamientos","Cuando exista riesgo de explosiones"],"correct":1,"explanation":"La respuesta correcta es la B: Cuando exista riesgo de congelación. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-16","test":9,"num":16,"q":"¿Qué mide un opacímetro?","options":["La temperatura de humos","La cantidad de $\\text{CO}_2$","El porcentaje de hollín","El porcentaje de $\\text{CO}$"],"correct":2,"explanation":"La respuesta correcta es la C: El porcentaje de hollín. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-17","test":9,"num":17,"q":"Un proceso de combustión con apreciable contenido de $\\text{CO}$ y bajo contenido de $\\text{CO}_2$ significa:","options":["Combustión correcta","Exceso de aire","Falta de aire","No puede concluirse nada en concreto"],"correct":2,"explanation":"La respuesta correcta es la C: Falta de aire. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-18","test":9,"num":18,"q":"¿Cuántas válvulas de retención debe disponer el sistema de alimentación de una caldera, con una sola bomba?","options":["Tres","Dos","Una como mínimo","No es obligatorio"],"correct":1,"explanation":"La respuesta correcta es la B: Dos. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-19","test":9,"num":19,"q":"Según el Artículo 12 de la ITC-EP1 del RD 809/2021 de 21 de septiembre, el operador de calderas dispondrá de diversa documentación de la instalación, entre los cuales se encuentra:","options":["Manual de Seguridad del operador/ora, redactado por el propio usuario","Dirección del Servicio Contra Incendios más próximo","Prescripciones de los niveles de emisiones a la atmósfera","Todas las respuestas son correctas"],"correct":3,"explanation":"La respuesta correcta es la D: Todas las respuestas son correctas. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-20","test":9,"num":20,"q":"¿Qué se entiende por vapor sobrecalentado?","options":["Es aquel vapor que tiene una temperatura inferior a la que le corresponde por su presión","Es aquel vapor que tiene una temperatura igual a la que le corresponde por su presión","Es aquel vapor que tiene una temperatura superior a la que le corresponde por su presión","Es aquel vapor que sale de la caldera y previamente ha pasado por el precalentador"],"correct":2,"explanation":"La respuesta correcta es la C: Es aquel vapor que tiene una temperatura superior a la que le corresponde por su presión. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-21","test":9,"num":21,"q":"Cuando exista un colector común para dos o más calderas, deberá instalarse:","options":["Una válvula de retención que impida el paso de vapor de una caldera a otra caldera","Un recalentador común","Una válvula de seguridad cuando la presión máxima admisible del colector es inferior a la de la caldera de presión superior","Un precalentador común"],"correct":0,"explanation":"La respuesta correcta es la A: Una válvula de retención que impida el paso de vapor de una caldera a otra caldera. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-22","test":9,"num":22,"q":"¿Es posible que en los humos de la combustión haya $\\text{SO}_2$?","options":["Sí, porque algunos combustibles llevan azufre","No, porque ningún combustible lleva azufre","Sí, porque algunos combustibles llevan sílice","No, porque ningún combustible lleva sílice"],"correct":0,"explanation":"La respuesta correcta es la A: Sí, porque algunos combustibles llevan azufre. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-23","test":9,"num":23,"q":"En una caldera que funciona totalmente llena de agua (por ejemplo, de agua sobrecalentada), ¿qué sistema se empleará para parar el quemador por falta de agua?","options":["Un dispositivo de nivel mínimo instalado en la caldera","Un dispositivo de nivel mínimo instalado en el vaso de expansión","No se precisa ningún dispositivo","Un presostato combinado con un termostato"],"correct":1,"explanation":"La respuesta correcta es la B: Un dispositivo de nivel mínimo instalado en el vaso de expansión. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-24","test":9,"num":24,"q":"Un domo es:","options":["Un limitador electrónico de presión","Un depósito cilíndrico horizontal que determina el nivel de separación del agua y del vapor en calderas acuotubulares","El conjunto de tubos en las calderas acuotubulares","Una alarma en calderas de vaporización instantánea"],"correct":1,"explanation":"La respuesta correcta es la B: Un depósito cilíndrico horizontal que determina el nivel de separación del agua y del vapor en calderas acuotubulares. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-25","test":9,"num":25,"q":"La inspección periódica de nivel C ha de ser realizada por:","options":["Los servicios competentes de la Administración","Por el fabricante","Por la empresa instaladora si el $P \\times V$ es igual o inferior a 10","Por algún Organismo de Control autorizado"],"correct":3,"explanation":"La respuesta correcta es la D: Por algún Organismo de Control autorizado. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-26","test":9,"num":26,"q":"¿Qué finalidad tiene analizar los gases de combustión?","options":["Ajustar el quemador para así obtener el máximo rendimiento","Conocer el grado de suciedad de la caldera","Aumentar la producción de vapor","Conocer el grado de corrosión general de la instalación"],"correct":0,"explanation":"La respuesta correcta es la A: Ajustar el quemador para así obtener el máximo rendimiento. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-27","test":9,"num":27,"q":"Se para el quemador de una caldera cuando el termómetro marca 200 °C y la presión es de $16\\text{ kg/cm}^2$. Si se abre la válvula de salida de vapor hasta que la presión baje, bruscamente, a $6\\text{ kg/cm}^2$, ¿qué se observa en el nivel de agua?","options":["Habrá bajado","Habrá subido","No se habrá movido","Primero baja y después sube"],"correct":0,"explanation":"La respuesta correcta es la A: Habrá bajado. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-28","test":9,"num":28,"q":"¿Por qué es preciso en las tuberías de vapor dar una pendiente mínima del 0,5%?","options":["Para favorecer el paso de vapor","Para ayudar a la evacuación de condensados","Para evitar condensados","Para cuestiones estéticas"],"correct":1,"explanation":"La respuesta correcta es la B: Para ayudar a la evacuación de condensados. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-29","test":9,"num":29,"q":"Un presostato y un termostato se diferencian en:","options":["El presostato regula temperatura y el termostato regula temperatura","El presostato regula variaciones de presión y el termostato de temperatura","Cumplen la misma función","Si son de seguridad son iguales"],"correct":1,"explanation":"La respuesta correcta es la B: El presostato regula variaciones de presión y el termostato de temperatura. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"9-30","test":9,"num":30,"q":"Un exceso de oxígeno disuelto en el agua de alimentación de la caldera puede producir:","options":["Corrosión","Formación de espumas","Formación de lodos","Arrastres de agua con el vapor"],"correct":0,"explanation":"La respuesta correcta es la A: Corrosión. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."}]},{"id":10,"title":"Test de repaso 10","questions":[{"id":"10-1","test":10,"num":1,"q":"¿Cuáles son los controladores de nivel que actúan sobre las bombas de alimentación en calderas automáticas de vapor con nivel definido?","options":["El limitador de nivel termostático","Los de flotador o boya y por electrodos","No necesitan nada ya que es caldera automática","Ninguna respuesta es correcta"],"correct":1,"explanation":"La respuesta correcta es la B: Los de flotador o boya y por electrodos. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-2","test":10,"num":2,"q":"Cuando se utiliza el sistema de desgasificación térmica para eliminar el oxígeno del agua de alimentación, ¿cuál es la temperatura mínima que debe alcanzarse en el desgasificador?","options":["120 °C","90 °C","110 °C","100 °C"],"correct":3,"explanation":"La respuesta correcta es la D: 100 °C. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-3","test":10,"num":3,"q":"Una caldera de agua sobrecalentada y vigilancia indirecta, ¿cuántos termostatos deberá llevar?","options":["Un termostato de seguridad","Dos termostatos (uno de trabajo y uno de seguridad)","Solo un termostato de trabajo","Ninguna respuesta es correcta"],"correct":1,"explanation":"La respuesta correcta es la B: Dos termostatos (uno de trabajo y uno de seguridad). La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-4","test":10,"num":4,"q":"¿Para qué sirve un NIVOSTATO?","options":["Para detectar incrementos de temperatura en calderas de vapor sin nivel definido","Para parar el quemador si hay una presión excesiva en la caldera","Para bloquear el quemador por insuficiente nivel de agua, en calderas de vapor con nivel definido","Para accionar las bombas de alimentación de agua a caldera"],"correct":2,"explanation":"La respuesta correcta es la C: Para bloquear el quemador por insuficiente nivel de agua, en calderas de vapor con nivel definido. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-5","test":10,"num":5,"q":"Según el Reglamento de Equipos a Presión, se entiende como equipo a presión cualquier elemento que esté sometido a una presión máxima admisible (PS):","options":["$\\le 0,5\\text{ bar}$","$> 1\\text{ bar}$","$> 0,5\\text{ bar}$","$\\le 1\\text{ bar}$"],"correct":2,"explanation":"La respuesta correcta es la C: $> 0,5\\text{ bar}$. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-6","test":10,"num":6,"q":"El cambio de combustible de una caldera, que no altere las prestaciones originales y esté respaldado en la documentación de fabricante, se considera:","options":["Modificación, y requiere de un certificado de modificación emitido por una empresa reparadora habilitada, presentación de un proyecto de una persona técnica titulada competente e inspección de nivel C","Modificación importante y requiere de nueva evaluación de conformidad","Reparación, y requiere de un certificado de reparación, emitido por una empresa reparadora habilitada","No está considerado reparación"],"correct":0,"explanation":"La respuesta correcta es la A: Modificación, y requiere de un certificado de modificación emitido por una empresa reparadora habilitada, presentación de un proyecto de una persona técnica titulada competente e inspección de nivel C. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-7","test":10,"num":7,"q":"El sobrecalentador en una caldera de vapor efectúa la siguiente operación:","options":["Sube la presión del vapor saturado","Baja la temperatura del condensado","Sube la temperatura del vapor saturado","Incrementa la humedad del vapor saturado"],"correct":2,"explanation":"La respuesta correcta es la C: Sube la temperatura del vapor saturado. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-8","test":10,"num":8,"q":"¿Cómo se define la presión de Precinto?","options":["Aquella a la que se somete el equipo a presión para comprobar su resistencia","A la equivalente a la Presión de Diseño","Aquella a la que está tarado el elemento de seguridad que protege el equipo a presión","A la presión más alta que puede alcanzar un equipo a presión en funcionamiento"],"correct":2,"explanation":"La respuesta correcta es la C: Aquella a la que está tarado el elemento de seguridad que protege el equipo a presión. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-9","test":10,"num":9,"q":"¿Qué considerarás como vapor seco?","options":["Vapor con pocas gotas de agua en suspensión","Vapor saturado, sobrecalentado ligeramente","Agua a baja presión y temperatura constante","Ninguna de las respuestas anteriores corresponde a un vapor seco"],"correct":1,"explanation":"La respuesta correcta es la B: Vapor saturado, sobrecalentado ligeramente. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-10","test":10,"num":10,"q":"La sustitución de hasta un 15% del haz tubular, en calderas pirotubulares (incluidos tubos soldados y mandrinados), que no supongan más de 5 tubos, se considera:","options":["Modificación y requiere un certificado de modificación emitido por una empresa reparadora habilitada","Como modificación importante y requiere una nueva evaluación de conformidad","Reparación, y requiere certificado de reparación, emitido por una empresa reparadora habilitada","No está considerada como reparación de la caldera"],"correct":3,"explanation":"La respuesta correcta es la D: No está considerada como reparación de la caldera. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-11","test":10,"num":11,"q":"La presencia del pulsador de parada de emergencia en la sala de calderas, cuando el sistema de vigilancia es indirecta:","options":["Se ubicará en la sala de calderas","Se ubicará donde prescriba el/la fabricante","Se ubicará en la sala con repetición de las señales de seguridades","Ninguna respuesta anterior es correcta"],"correct":3,"explanation":"La respuesta correcta es la D: Ninguna respuesta anterior es correcta. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-12","test":10,"num":12,"q":"Tras la reparación de una caldera, y antes de su puesta nuevamente en servicio, es preceptivo pasar una inspección de nivel C, que deberá realizar en todos los casos:","options":["El fabricante del equipo habilitado","Un Organismo de Control","Una Empresa instaladora EIP-2","Cualquiera de los anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Un Organismo de Control. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-13","test":10,"num":13,"q":"En las inspecciones y pruebas periódicas de calderas, deberán tenerse en cuenta las condiciones indicadas en las normas:","options":["UNE EN 438","UNE 192011-1","UNE EN 431","UNE 192011-11"],"correct":3,"explanation":"La respuesta correcta es la D: UNE 192011-11. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-14","test":10,"num":14,"q":"La conservación por el procedimiento seco, en las calderas industriales, es la forma de conservación en paro prolongado más frecuente en aquellas calderas que:","options":["Van a estar fuera de servicio durante un período mayor","En lugares en que estén instaladas donde se puedan producir temperaturas por encima de 45 °C","No se recomienda si llevan sobrecalentadores o recalentadores","Ninguna respuesta es válida"],"correct":0,"explanation":"La respuesta correcta es la A: Van a estar fuera de servicio durante un período mayor. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-15","test":10,"num":15,"q":"Según el artículo 3 de la ITC EP1 del Real Decreto 809/2021 de 21 de septiembre, por el que se aprueba el Reglamento de Equipos a Presión y sus ITC's, ¿qué caldera es de clase primera?","options":["Calderas de fluido térmico, con presión de vapor del líquido portador térmico, a la temperatura máxima de servicio inferior o igual a 0,5 bar y tenga un $Vi < 5000$","Calderas pirotubulares cuyo $15.000 < Pms \\times VT < 20.000$","Calderas pirotubulares cuyo $50.000 < Pms \\times VT < 80.000$","Calderas de fluido térmico no incluidas en el apartado A cuya $Pms \\times VL < 15.000$"],"correct":0,"explanation":"La respuesta correcta es la A: Calderas de fluido térmico, con presión de vapor del líquido portador térmico, a la temperatura máxima de servicio inferior o igual a 0,5 bar y tenga un $Vi < 5000$. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-16","test":10,"num":16,"q":"Según el Artículo 6 de la ITC EP1 del RD 809/2021 de 21 de septiembre, para las calderas de clase segunda, no será necesario disponer de muros de protección, en el caso
