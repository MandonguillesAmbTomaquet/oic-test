as condiciones originales de diseño, sin tratamiento térmico previo) se considera:","options":["Modificación y requiere certificado de modificación emitido por empresa reparadora habilitada","Modificación importante y requiere nueva evaluación de la conformidad","Reparación y requiere un certificado de reparación emitido por una empresa reparadora habilitada","No está considerada como reparación de la caldera"],"correct":3,"explanation":"La respuesta correcta es la D: No está considerada como reparación de la caldera. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-20","test":10,"num":20,"q":"El responsable de mantenimiento de la caldera es:","options":["El operador de caldera","El usuario","El fabricante","Todas las anteriores respuestas"],"correct":1,"explanation":"La respuesta correcta es la B: El usuario. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-21","test":10,"num":21,"q":"La inspección de nivel B de una caldera se realizará por:","options":["El usuario de la caldera","Por el fabricante de la caldera, si está habilitado como empresa instaladora EIP-2","El director de planta","Ninguna de las respuestas anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: Por el fabricante de la caldera, si está habilitado como empresa instaladora EIP-2. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-22","test":10,"num":22,"q":"Señale la respuesta correcta. Según el Apartado 1 del Anexo I del RD 809/2021 de 21 de septiembre, en la inspección periódica de nivel B de una caldera pirotubular se inspeccionará:","options":["Virotillos y tirantes","Calderines","Haces tubulares o serpentines","Estructuras y fijaciones de tubos a tambores y colectores"],"correct":0,"explanation":"La respuesta correcta es la A: Virotillos y tirantes. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-23","test":10,"num":23,"q":"Señale la respuesta correcta, según el Artículo 6 de la ITC EP1 del RD 809/2021 de 21 de septiembre, el espesor mínimo de los muros de protección que separan la sala de una caldera de clase segunda del riesgo ajeno será:","options":["5 cm","15 cm","20 cm","25 cm"],"correct":2,"explanation":"La respuesta correcta es la C: 20 cm. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-24","test":10,"num":24,"q":"Según el artículo 6 de la ITC EP1 del Real Decreto 809/2021 de 21 de septiembre, las puertas de la sala de una caldera de clase segunda serán:","options":["De madera de 1,60 m de ancho como mínimo","Metálicas de 2,50 m de alto como máximo","De hormigón de 2,50 m de alto como máximo","De PVC de 2,60 m de alto como mínimo"],"correct":1,"explanation":"La respuesta correcta es la B: Metálicas de 2,50 m de alto como máximo. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-25","test":10,"num":25,"q":"Señale la respuesta correcta según el artículo 6 de la ITC EP1 del RD 809/2021 de 21 de septiembre, la puerta de una sala de calderas de clase 2ª, ¿puede incorporar rejillas de celosía para ventilación?","options":["Nunca","Sí","Depende de las dimensiones de la caldera","Depende del material de la puerta"],"correct":1,"explanation":"La respuesta correcta es la B: Sí. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-26","test":10,"num":26,"q":"¿Cómo clasificaríamos las calderas según su circulación?","options":["De tubos horizontales, inclinados, verticales","Natural, asistida, forzada","Acuotubulares, pirotubulares","De hogar presurizado, de hogar equilibrado"],"correct":1,"explanation":"La respuesta correcta es la B: Natural, asistida, forzada. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-27","test":10,"num":27,"q":"Las válvulas de seguridad son los dispositivos para evacuar el caudal del fluido necesario en una caldera de vapor, economizador, sobrecalentador y recalentador, de tal forma que no se sobrepase la presión de timbre del elemento correspondiente. De las siguientes afirmaciones, ¿cuál consideraría correcta?","options":["Las válvulas de seguridad de calderas, sobrecalentadores y recalentadores se caracterizan por una apertura rápida y total, no proporcional al incremento de presión","Las válvulas de seguridad para economizadores, o de alivio, se caracterizan por una apertura automática y proporcional, cuando la presión sobrepasa el valor de tarado","La respuesta a) es correcta","Las respuestas a) y b) son correctas"],"correct":3,"explanation":"La respuesta correcta es la D: Las respuestas a) y b) son correctas. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-28","test":10,"num":28,"q":"Señale la respuesta correcta. 100.000 pascales equivalen a:","options":["1 bar","10 bares","100 bares","1000 bares"],"correct":0,"explanation":"La respuesta correcta es la A: 1 bar. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-29","test":10,"num":29,"q":"La ITC-EP1 del RD 809/2021 de 21 de septiembre fija el nivel mínimo de agua (LWL) que deberá existir sobre la superficie de intercambio de calor más elevada (HHS), sea el siguiente:","options":["100 mm para caldera acuotubular y 70 mm para caldera pirotubular","100 mm para caldera pirotubular y 150 mm para caldera acuotubular","70 mm para ambos tipos de caldera (piro y acuotubular)","Ninguna de las anteriores"],"correct":1,"explanation":"La respuesta correcta es la B: 100 mm para caldera pirotubular y 150 mm para caldera acuotubular. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."},{"id":"10-30","test":10,"num":30,"q":"Señale la respuesta correcta. Según el Apartado 1 del anexo I de la ITC-EP1 del RD 809/2021 de 21 de septiembre, en la inspección periódica de nivel B de una caldera acuotubular, se inspeccionará:","options":["Virotillos y tirantes","Cartelas de refuerzo","Tubos, placas tubulares y colectores","Estructuras y fijaciones a tambores (calderines) y colectores"],"correct":3,"explanation":"La respuesta correcta es la D: Estructuras y fijaciones a tambores (calderines) y colectores. La tabla oficial marca esta opción y el concepto está desarrollado en el temario del curso de Operador Industrial de Calderas."}]}];
const $=s=>document.querySelector(s),main=$('#main'),exitBtn=$('#exitBtn'),progressWrap=$('#progressWrap'),progressBar=$('#progressBar'),exitDialog=$('#exitDialog');let session=null;
const memoryStore={};
const store={
  persistent:false,
  init(){try{const k='__oic_test__';localStorage.setItem(k,'1');localStorage.removeItem(k);this.persistent=true}catch(e){this.persistent=false}},
  get(k,d){if(this.persistent){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){this.persistent=false}}return Object.prototype.hasOwnProperty.call(memoryStore,k)?memoryStore[k]:d},
  set(k,v){memoryStore[k]=v;if(this.persistent){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){this.persistent=false}}return v},
  remove(k){delete memoryStore[k];if(this.persistent){try{localStorage.removeItem(k)}catch(e){this.persistent=false}}},
  exportData(){const data={oic_fails:this.get('oic_fails',[]),oic_history:this.get('oic_history',[]),oic_session:this.get('oic_session',null)};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='copia_seguridad_oic.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  importData(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);['oic_fails','oic_history','oic_session'].forEach(k=>{if(k in d)this.set(k,d[k])});alert('Copia restaurada correctamente');home()}catch(e){alert('El archivo no es una copia válida de OIC Test')}};r.readAsText(f)}
};
store.init();
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(s){
  let t=String(s);
  t=t.replace(/\$/g,'');
  t=t.replace(/\\text\{\s*([^}]+)\}/g,'$1');
  t=t.replace(/\\times/g,'×').replace(/\\le/g,'≤').replace(/\\ge/g,'≥');
  t=t.replace(/\\%/g,'%');
  t=t.replace(/_([0-9]+)/g,(m,n)=>n.split('').map(d=>({'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'}[d])).join(''));
  t=t.replace(/\^([0-9]+)/g,(m,n)=>n.split('').map(d=>({'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}[d])).join(''));
  t=t.replace(/\\\s+/g,' ').replace(/\\,/g,' ');
  return esc(t.trim());
}
function home(){session=null;exitBtn.style.display='none';progressWrap.style.display='none';const fails=store.get('oic_fails',[]),saved=store.get('oic_session',null);main.innerHTML=`<section class="hero"><span class="badge">Preparación oficial</span><h1>Practica los 10 tests OIC</h1><p>30 preguntas por test, corrección al finalizar, explicación de errores y banco personal de fallos.</p><div class="explain" style="margin-top:14px;border-left-color:${store.persistent?'var(--ok)':'#d99000'}"><b>${store.persistent?'Guardado permanente activado':'Modo de vista previa'}</b><br>${store.persistent?'El progreso y los fallos se conservarán en este dispositivo.':'La app funciona, pero este visor bloquea el almacenamiento permanente. Si cierras esta pestaña se perderá el progreso; descarga y abre el archivo en el navegador para conservarlo.'}</div></section>${saved?`<button class="btn primary" style="width:100%;margin-bottom:18px" onclick="resume()">Continuar test ${saved.testId} · pregunta ${saved.index+1}</button>`:''}<div class="sectiontitle"><h2>Tests disponibles</h2><span class="small">300 preguntas</span></div><div class="grid">${TESTS.map(t=>`<button class="testcard" onclick="start(${t.id})"><b>Test ${t.id}</b><span>30 preguntas</span></button>`).join('')}</div><div class="sectiontitle"><h2>Entrenamiento</h2></div><div class="grid"><button class="testcard" onclick="startFailures()"><b>Test de fallos</b><span>${fails.length} preguntas guardadas</span></button><button class="testcard" onclick="showStats()"><b>Mi progreso</b><span>Resultados por test</span></button></div><div class="sectiontitle"><h2>Copia de seguridad</h2></div><div class="grid"><button class="testcard" onclick="store.exportData()"><b>Exportar progreso</b><span>Guarda fallos e historial</span></button><label class="testcard" style="display:block"><b>Importar progreso</b><span>Restaura una copia</span><input type="file" accept="application/json" onchange="store.importData(this)" style="display:none"></label></div>`}
function start(id){session={testId:id,questions:TESTS.find(t=>t.id===id).questions,index:0,answers:{},mode:'test'};store.set('oic_session',session);renderQ()}
function resume(){session=store.get('oic_session',null);if(session)renderQ();else home()}
function startFailures(){let ids=store.get('oic_fails',[]),all=TESTS.flatMap(t=>t.questions),qs=all.filter(q=>ids.includes(q.id));if(!qs.length){main.innerHTML='<div class="empty"><h2>No tienes fallos guardados</h2><p>Las preguntas que falles aparecerán aquí automáticamente.</p><button class="btn primary" onclick="home()">Volver</button></div>';return}session={testId:'Fallos',questions:qs,index:0,answers:{},mode:'fails'};renderQ()}
function renderQ(){exitBtn.style.display='block';progressWrap.style.display='block';exitBtn.onclick=()=>exitDialog.showModal();let q=session.questions[session.index],ans=session.answers[q.id];progressBar.style.width=((session.index+1)/session.questions.length*100)+'%';main.innerHTML=`<div class="questionCard"><div class="qmeta"><span>${session.mode==='fails'?'Test de fallos':'Test '+session.testId}</span><strong>${session.index+1} / ${session.questions.length}</strong></div><h2 class="qtext">${fmt(q.q)}</h2>${q.options.map((o,i)=>`<button class="option ${ans===i?'selected':''}" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${fmt(o)}</span></button>`).join('')}</div><div class="nav"><button class="btn secondary" onclick="prev()" ${session.index===0?'disabled':''}>Anterior</button>${session.index===session.questions.length-1?'<button class="btn primary" onclick="finishConfirm()">Finalizar test</button>':'<button class="btn primary" onclick="next()">Siguiente</button>'}</div>`}
function choose(i){let q=session.questions[session.index];session.answers[q.id]=i;store.set('oic_session',session);renderQ()}
function next(){if(session.index<session.questions.length-1){session.index++;store.set('oic_session',session);renderQ()}}
function prev(){if(session.index>0){session.index--;store.set('oic_session',session);renderQ()}}
function saveAndExit(){store.set('oic_session',session);exitDialog.close();home()}
function finishConfirm(){let unanswered=session.questions.filter(q=>session.answers[q.id]===undefined).length;if(unanswered&&!confirm(`Quedan ${unanswered} preguntas sin responder. Se contarán como error. ¿Finalizar?`))return;finish()}
function finish(){let errors=session.questions.filter(q=>session.answers[q.id]!==q.correct),correct=session.questions.length-errors.length,fails=new Set(store.get('oic_fails',[]));errors.forEach(q=>fails.add(q.id));session.questions.filter(q=>session.answers[q.id]===q.correct).forEach(q=>fails.delete(q.id));store.set('oic_fails',[...fails]);let hist=store.get('oic_history',[]);hist.push({test:session.testId,date:new Date().toISOString(),correct,errors:errors.length,total:session.questions.length});store.set('oic_history',hist);store.set('oic_last_errors',errors.map(q=>q.id));store.remove('oic_session');let apt=errors.length<=8,pct=Math.round(correct/session.questions.length*100);exitBtn.style.display='none';progressWrap.style.display='none';main.innerHTML=`<section class="result"><div class="ring" style="--pct:${pct}%"><strong>${pct}%</strong></div><div class="status ${apt?'ok':'bad'}">${apt?'APTO':'NO APTO'}</div><p>${apt?'Has superado el test.':'Necesitas repasar antes de volver a intentarlo.'}</p><div class="rowstats"><div class="stat"><strong style="color:var(--ok)">${correct}</strong><span>Aciertos</span></div><div class="stat"><strong style="color:var(--bad)">${errors.length}</strong><span>Errores</span></div></div>${errors.length?'<button class="btn primary" style="width:100%" onclick="reviewLast()">Repasar errores</button>':'<button class="btn primary" style="width:100%" onclick="home()">Volver al inicio</button>'}<button class="btn secondary" style="width:100%;margin-top:9px" onclick="home()">Ir al siguiente / elegir test</button><p class="small" style="margin-top:16px">Criterio aplicado: APTO con 8 errores o menos; NO APTO con más de 8.</p></section>`}
function reviewLast(){let ids=store.get('oic_last_errors',[]),all=TESTS.flatMap(t=>t.questions),qs=all.filter(q=>ids.includes(q.id));exitBtn.style.display='none';main.innerHTML=`<div class="sectiontitle"><h2>Repaso de errores</h2><span class="small">${qs.length} preguntas</span></div>${qs.map(q=>{let a=session?.answers?.[q.id];return `<article class="reviewItem"><div class="small">Test ${q.test} · Pregunta ${q.num}</div><h3>${fmt(q.q)}</h3>${a!==undefined?`<p><b>Tu respuesta:</b> ${'ABCD'[a]}. ${fmt(q.options[a])}</p>`:'<p><b>Tu respuesta:</b> Sin responder</p>'}<p style="color:var(--ok)"><b>Correcta:</b> ${'ABCD'[q.correct]}. ${fmt(q.options[q.correct])}</p><div class="explain">${fmt(q.explanation)}</div></article>`}).join('')}<button class="btn primary" style="width:100%" onclick="home()">Volver al inicio</button>`}
function showStats(){let h=store.get('oic_history',[]);if(!h.length){main.innerHTML='<div class="empty"><h2>Aún no hay resultados</h2><p>Completa un test para ver tu progreso.</p><button class="btn primary" onclick="home()">Volver</button></div>';return}let rows=[...h].reverse().slice(0,30);main.innerHTML=`<div class="sectiontitle"><h2>Mi progreso</h2></div>${rows.map(r=>`<article class="reviewItem"><b>${r.test==='Fallos'?'Test de fallos':'Test '+r.test}</b><div class="small">${new Date(r.date).toLocaleString('es-ES')}</div><p>${r.correct}/${r.total} aciertos · ${r.errors} errores · <b style="color:${r.errors<=8?'var(--ok)':'var(--bad)'}">${r.errors<=8?'APTO':'NO APTO'}</b></p></article>`).join('')}<button class="btn primary" style="width:100%" onclick="home()">Volver</button>`}
home();</script></body></html>
